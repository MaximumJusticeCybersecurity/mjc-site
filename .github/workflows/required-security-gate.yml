name: Required Security Gate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: required-security-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  required-security-gate:
    name: Required Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install package metadata
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate site security posture
        run: npm run check:security-posture

      - name: Validate Local Digital Brain email gate
        run: npm run check:email-gate
