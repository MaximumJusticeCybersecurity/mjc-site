name: Required Security Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: required-security-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-security-gate:
    name: Required Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install package metadata
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate site security posture
        run: npm run check:security-posture

      - name: Validate Local Digital Brain email gate
        run: npm run check:email-gate
