name: Site Security Posture

on:
  pull_request:
    paths:
      - "vercel.json"
      - "package.json"
      - "build.mjs"
      - "site/**"
      - "tests/site-security-posture.test.mjs"
      - "docs/20260818-mjc-web-security-baseline.md"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "vercel.json"
      - "package.json"
      - "build.mjs"
      - "site/**"
      - "tests/site-security-posture.test.mjs"
      - "docs/20260818-mjc-web-security-baseline.md"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: site-security-posture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-security-posture:
    name: Site Security Posture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install package metadata
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate site security posture
        run: npm run check:security-posture
