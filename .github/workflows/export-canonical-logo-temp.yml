name: Export Canonical MJC Logo Temp
on:
  push:
    branches:
      - 'sterling/export-canonical-logo-temp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical logo
        shell: bash
        run: |
          test -f site/mjc-logo.png
          printf 'LOGO_SHA256=' && sha256sum site/mjc-logo.png | awk '{print $1}'
      - name: Upload canonical logo
        uses: actions/upload-artifact@v4
        with:
          name: canonical-mjc-logo
          path: site/mjc-logo.png
          if-no-files-found: error
          retention-days: 1
